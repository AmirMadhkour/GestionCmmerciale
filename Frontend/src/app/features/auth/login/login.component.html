<div class="flex min-h-full items-center justify-center bg-gradient-to-br from-primary-50 via-white to-slate-100 px-4 py-12">
  <div class="w-full max-w-md">
    <div class="mb-8 flex flex-col items-center text-center">
      <span class="flex h-14 w-14 items-center justify-center rounded-2xl bg-primary-600 text-xl font-bold text-white shadow-lg">GC</span>
      <h1 class="mt-4 text-2xl font-bold tracking-tight text-slate-900">{{ appName }}</h1>
      <p class="mt-1 text-sm text-slate-500">Connectez-vous pour accéder à votre espace</p>
    </div>

    <div class="card p-8">
      @if (errorMessage()) {
        <div class="mb-6 rounded-lg border border-red-200 bg-red-50 px-4 py-3 text-sm text-red-700" role="alert">
          {{ errorMessage() }}
        </div>
      }

      <form [formGroup]="form" (ngSubmit)="submit()" novalidate class="space-y-5">
        <div>
          <label for="email" class="form-label">Adresse email</label>
          <input
            id="email"
            type="email"
            formControlName="email"
            autocomplete="email"
            placeholder="nom@entreprise.com"
            class="form-input"
            [class.form-input-invalid]="isInvalid(form.controls.email)"
          />
          <app-field-error [control]="form.controls.email" label="L’email" />
        </div>

        <div>
          <label for="password" class="form-label">Mot de passe</label>
          <div class="relative">
            <input
              id="password"
              formControlName="password"
              autocomplete="current-password"
              placeholder="••••••••"
              class="form-input pr-20"
              [type]="showPassword() ? 'text' : 'password'"
              [class.form-input-invalid]="isInvalid(form.controls.password)"
            />
            <button
              type="button"
              class="absolute inset-y-0 right-0 px-3 text-xs font-medium text-slate-500 hover:text-slate-800"
              (click)="togglePassword()"
            >
              {{ showPassword() ? 'Masquer' : 'Afficher' }}
            </button>
          </div>
          <app-field-error [control]="form.controls.password" label="Le mot de passe" />
        </div>

        <button type="submit" class="btn-primary w-full py-2.5" [disabled]="submitting()">
          @if (submitting()) {
            <span class="h-4 w-4 animate-spin rounded-full border-2 border-white border-t-transparent"></span>
            Connexion en cours...
          } @else {
            Se connecter
          }
        </button>
      </form>
    </div>
  </div>
</div>
