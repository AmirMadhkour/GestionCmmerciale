<div class="mb-6">
  @if (backLink(); as link) {
    <a [routerLink]="link" class="mb-3 inline-flex items-center gap-1 text-sm font-medium text-slate-500 hover:text-slate-800">
      <span aria-hidden="true">←</span>
      {{ backLabel() }}
    </a>
  }
  <div class="flex flex-col gap-4 sm:flex-row sm:items-center sm:justify-between">
    <div class="min-w-0">
      <div class="flex flex-wrap items-center gap-3">
        <h1 class="truncate text-2xl font-bold tracking-tight text-slate-900">{{ heading() }}</h1>
        <ng-content select="[badge]" />
      </div>
      @if (subtitle()) {
        <p class="mt-1 text-sm text-slate-500">{{ subtitle() }}</p>
      }
    </div>
    <div class="flex flex-wrap items-center gap-2">
      <ng-content />
    </div>
  </div>
</div>
